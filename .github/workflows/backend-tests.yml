name: Backend Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SourceCode/SQLAPI/POS.sln

      - name: Build
        run: dotnet build SourceCode/SQLAPI/POS.sln --no-restore -v q

      - name: Unit tests (POS.MediatR.Tests)
        run: dotnet test SourceCode/SQLAPI/Tests/POS.MediatR.Tests/POS.MediatR.Tests.csproj --no-build --logger "console;verbosity=normal"

      - name: Integration tests + coverage (POS.API.Tests)
        run: >
          dotnet test SourceCode/SQLAPI/Tests/POS.API.Tests/POS.API.Tests.csproj
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --logger "console;verbosity=normal"

      - name: Generate coverage report
        run: |
          dotnet tool restore
          dotnet reportgenerator -reports:./TestResults/**/coverage.cobertura.xml -targetdir:./TestResults/CoverageReport -reporttypes:"Html;TextSummary"

      - name: Show coverage summary
        run: Get-Content ./TestResults/CoverageReport/Summary.txt

      - name: Upload test results and coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            TestResults/CoverageReport/
          retention-days: 14

      # COVERAGE GATE: not enforced yet by design.
      # Plan (Test-Documentation/00_TEST_STRATEGY.md §8): ratchet the threshold up as Waves 1-6 land
      # and enforce >=90% in Wave 6 via coverlet.msbuild /p:Threshold or ReportGenerator.
